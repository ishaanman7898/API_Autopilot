name: action-selftest

# Runs the composite action in action.yml on a real runner against a copy of examples/app, and in
# watch mode against a repository that depends on Mux 14, using the real npm registry and GitHub.
# Pushed branches go to a local bare repository and `gh` is a stand-in that records its
# arguments, so the test checks everything up to the pull request without opening one.
on:
  push:
    branches: [main]
    paths: [action.yml, scripts/**, src/**, bin/**, examples/**, .github/workflows/action-selftest.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tool
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Make a consumer repository with a signed rule
        shell: bash
        run: |
          set -euo pipefail
          cp -R tool/examples/app/. .
          npm ci --omit=dev --ignore-scripts --prefix tool
          node tool/bin/apimigrate.js keygen --out "$RUNNER_TEMP/keys"
          mkdir -p migrations keys
          cp tool/examples/acme-1-to-2.rules.json migrations/acme.rules.json
          node tool/bin/apimigrate.js sign migrations/acme.rules.json --key "$RUNNER_TEMP/keys/apimigrate-private.pem"
          cp "$RUNNER_TEMP/keys/apimigrate-keys.json" keys/
          printf 'tool/\n' > .gitignore
          git init -q -b main
          git add -A
          git -c user.name=t -c user.email=t@example.com commit -q -m base
          git init -q --bare "$RUNNER_TEMP/remote.git"
          git remote add origin "$RUNNER_TEMP/remote.git"
          git push -q origin main
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$*" >> "$RUNNER_TEMP/gh-calls.log"\n' > "$RUNNER_TEMP/bin/gh"
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run the action
        uses: ./tool
        with:
          rules: migrations/acme.rules.json
          keys: keys/apimigrate-keys.json
          test-cmd: node -e "0"

      - name: Check what the action did
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'payments.create({ amount: cents' src/billing.ts
          grep -q "from '@acme/sdk'" src/billing.ts
          test -f .apimigrate/evidence.json
          node -e 'const e = require("./.apimigrate/evidence.json"); if (!e.gate.ok || !e.rule.signed || e.unresolved.length !== 1) process.exit(1)'
          branch="$(git rev-parse --abbrev-ref HEAD)"
          case "$branch" in apimigrate/*) ;; *) echo "unexpected branch $branch"; exit 1 ;; esac
          git --git-dir="$RUNNER_TEMP/remote.git" show "$branch:src/billing.ts" | grep -q 'payments.create'
          cat "$RUNNER_TEMP/gh-calls.log"
          grep -q '^pr create --draft --title API migration: acme-sdk-1-to-2 --body-file ' "$RUNNER_TEMP/gh-calls.log"
          ! grep -q 'merge' "$RUNNER_TEMP/gh-calls.log"
          echo "action ran on a real runner and asked for a draft pull request only"

  watch-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tool
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # @mux/mux-node 15.5.0 is the last release under that name, so this upgrade stays the same.
      # The test calls the SDK the way the app does, against a port where nothing listens. It passes
      # only when the code and the installed version agree: a call the installed SDK lacks is a TypeError.
      - name: Make a consumer repository that uses Mux 14 and tests against it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src test
          printf '%s\n' '{ "name": "consumer", "private": true, "type": "module", "scripts": { "test": "node --test test/video.test.mjs" }, "dependencies": { "@mux/mux-node": "^14.1.1" } }' > package.json
          printf '%s\n' \
            "import Mux from '@mux/mux-node';" \
            "export const mux = new Mux({ tokenId: 'id', tokenSecret: 'secret', baseURL: 'http://127.0.0.1:9', maxRetries: 0 });" \
            "export const summarize = (id: string) => mux.robotsPreview.jobs.summarize.create({ parameters: { asset_id: id } });" \
            "export const browsers = () => mux.data.filters.listValues('browser');" > src/video.ts
          printf '%s\n' \
            "import test from 'node:test';" \
            "import assert from 'node:assert/strict';" \
            "import { summarize } from '../src/video.ts';" \
            "test('summarize reaches the API through the installed SDK', async () => {" \
            "  const error = await summarize('asset').then(() => null, (e) => e);" \
            "  assert.ok(error && !(error instanceof TypeError), String(error));" \
            "});" > test/video.test.mjs
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          printf 'tool/\nnode_modules/\n.apimigrate/\n' > .gitignore
          # The action is checked out under tool/, so limit the watcher to the consumer's dependency.
          printf 'watch:\n- "@mux/mux-node"\n' > .apimigrate.yml
          git init -q -b main
          git add -A
          git -c user.name=t -c user.email=t@example.com commit -q -m base
          git init -q --bare "$RUNNER_TEMP/remote.git"
          git remote add origin "$RUNNER_TEMP/remote.git"
          git push -q origin main
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$*" >> "$RUNNER_TEMP/gh-calls.log"\n' > "$RUNNER_TEMP/bin/gh"
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Watch npm and open draft pull requests
        uses: ./tool
        with:
          mode: watch
          test-cmd: npm test

      - name: Check the unsigned draft pull request
        shell: bash
        run: |
          set -euo pipefail
          branch=apimigrate/mux-mux-node-14-to-15-unsigned
          remote="$RUNNER_TEMP/remote.git"
          git --git-dir="$remote" show "$branch:src/video.ts"
          git --git-dir="$remote" show "$branch:src/video.ts" | grep -q "from '@mux/ts'"
          git --git-dir="$remote" show "$branch:src/video.ts" | grep -q 'mux.robots.jobs.summarize.create'
          git --git-dir="$remote" show "$branch:src/video.ts" | grep -q 'mux.data.filters.listValues'
          git --git-dir="$remote" show "$branch:package.json" | grep -q '"@mux/ts": "^15.5.0"'
          git --git-dir="$remote" show "$branch:package-lock.json" | grep -q '"node_modules/@mux/ts"'
          test "$(git --git-dir="$remote" diff --name-only main "$branch" | tr '\n' ' ')" = "package-lock.json package.json src/video.ts "
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          cat "$RUNNER_TEMP/gh-calls.log"
          grep -q '^pr create --draft --base main --head apimigrate/mux-mux-node-14-to-15-unsigned --title \[unsigned draft\] API migration: @mux/mux-node 14.1.1 to 15.5.0 --body-file ' "$RUNNER_TEMP/gh-calls.log"
          body="$(sed -n 's/.* --body-file //p' "$RUNNER_TEMP/gh-calls.log")"
          grep -q '^> \*\*Unsigned\.\*\*' "$body"
          grep -q 'removed-data.filters.listValues' "$body"
          grep -q '| Tests | exit code 0 |' "$body"
          grep -q '`package-lock.json` was updated' "$body"
          ! grep -q 'merge' "$RUNNER_TEMP/gh-calls.log"
          # The base versions are installed again after the upgrade.
          test "$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@mux/mux-node/package.json', 'utf8')).version.split('.')[0]")" = 14
          test ! -e node_modules/@mux/ts

      - name: Check that the pull request installs and passes its tests as it would in CI
        shell: bash
        run: |
          set -euo pipefail
          git clone -q -b apimigrate/mux-mux-node-14-to-15-unsigned "$RUNNER_TEMP/remote.git" "$RUNNER_TEMP/pr"
          cd "$RUNNER_TEMP/pr"
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Watch again
        uses: ./tool
        with:
          mode: watch
          test-cmd: npm test

      - name: Check that nothing was opened twice
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^pr create' "$RUNNER_TEMP/gh-calls.log")" -eq 1
          echo "watch mode ran on a real runner against npm and GitHub and asked for one unsigned draft pull request"
