name: API Autopilot
description: Apply a signed migration rule, or watch npm for new major versions, and open draft pull requests with an evidence bundle. Code stays on your runner. Never merges.
inputs:
  mode:
    description: apply runs the rule file in rules. watch looks for new major versions on npm and opens one draft pull request per upgrade, marking drafted rules as unsigned.
    required: false
    default: apply
  rules:
    description: Path to the signed rule file. Required in apply mode.
    required: false
  well-known:
    description: Provider domain that publishes /.well-known/apimigrate-keys.json. Use this or keys.
    required: false
  keys:
    description: Path to a key set JSON file you pinned in your repository. Use this or well-known.
    required: false
  test-cmd:
    description: Command that runs your tests. A failure stops the run before any pull request is opened.
    required: false
  install-cmd:
    description: When a rule changes package.json, the new versions are installed before the tests and the lockfile is updated, with the package manager the lockfile names and no install scripts. Set a command to run instead, or none to skip it.
    required: false
  token:
    description: Token used to push the branch and open the pull request
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install apimigrate dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --prefix "$ACTION_PATH"

    - name: Apply the rule
      id: apply
      if: inputs.mode != 'watch'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
        RULES: ${{ inputs.rules }}
        WELL_KNOWN: ${{ inputs.well-known }}
        KEYS: ${{ inputs.keys }}
        TEST_CMD: ${{ inputs.test-cmd }}
        INSTALL_CMD: ${{ inputs.install-cmd }}
      run: |
        set -euo pipefail
        if [ "$MODE" != "apply" ]; then echo "mode must be apply or watch" >&2; exit 2; fi
        if [ -z "$RULES" ]; then echo "rules is required in apply mode" >&2; exit 2; fi
        args=(apply --rules "$RULES")
        if [ -n "$WELL_KNOWN" ] && [ -n "$KEYS" ]; then echo "pass only one of well-known and keys" >&2; exit 2; fi
        if [ -n "$WELL_KNOWN" ]; then args+=(--well-known "$WELL_KNOWN"); fi
        if [ -n "$KEYS" ]; then args+=(--keys "$KEYS"); fi
        if [ "$INSTALL_CMD" = "none" ]; then :; elif [ -n "$INSTALL_CMD" ]; then args+=(--install-cmd "$INSTALL_CMD"); else args+=(--install); fi
        if [ -n "$TEST_CMD" ]; then args+=(--test-cmd "$TEST_CMD"); fi
        node "$ACTION_PATH/bin/apimigrate.js" "${args[@]}"

    - name: Upload the evidence bundle
      if: always() && inputs.mode != 'watch' && hashFiles('.apimigrate/evidence.json') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: apimigrate-evidence
        path: |
          .apimigrate/evidence.json
          .apimigrate/unresolved.json
          .apimigrate/audit.log

    - name: Open a draft pull request
      if: inputs.mode != 'watch'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RULES: ${{ inputs.rules }}
        GH_TOKEN: ${{ inputs.token }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        evidence=.apimigrate/evidence.json
        mapfile -d '' paths < <(node "$ACTION_PATH/scripts/pr.mjs" paths "$evidence")
        if [ "${#paths[@]}" -eq 0 ]; then echo "nothing to migrate, no pull request opened"; exit 0; fi
        branch="$(node "$ACTION_PATH/scripts/pr.mjs" branch "$evidence" "$RUN_ID")"
        title="API migration: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).rule.id.replace(/[^\w.-]+/g,"-"))' "$evidence")"
        node "$ACTION_PATH/scripts/pr.mjs" body "$evidence" "$RULES" > "$RUNNER_TEMP/apimigrate-pr-body.md"
        git switch -c "$branch"
        git add -- "${paths[@]}"
        git -c user.name=apimigrate -c user.email=apimigrate@users.noreply.github.com commit -m "$title"
        git push origin "$branch"
        # gh's stderr is kept so a refusal from the repository settings can name the setting to turn on.
        gh_err="$RUNNER_TEMP/apimigrate-gh.err"
        status=0
        gh pr create --draft --title "$title" --body-file "$RUNNER_TEMP/apimigrate-pr-body.md" 2> "$gh_err" || status=$?
        cat "$gh_err" >&2
        if [ "$status" -ne 0 ]; then
          if grep -q 'GitHub Actions is not permitted to create or approve pull requests' "$gh_err"; then
            echo 'GitHub does not let this workflow open pull requests. Turn on Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create and approve pull requests", or pass a token that can open pull requests in the token input of the action.' >&2
          fi
          exit "$status"
        fi

    - name: Watch for new major versions and open draft pull requests
      if: inputs.mode == 'watch'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OUT: ${{ runner.temp }}/apimigrate-watch
        TEST_CMD: ${{ inputs.test-cmd }}
        INSTALL_CMD: ${{ inputs.install-cmd }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/bin/apimigrate.js" watch --out "$OUT"
        node "$ACTION_PATH/scripts/watch-prs.mjs" "$OUT/plan.json"

    - name: Upload the watch plan, rules and evidence
      if: always() && inputs.mode == 'watch'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: apimigrate-watch
        path: ${{ runner.temp }}/apimigrate-watch
        if-no-files-found: ignore
        overwrite: true
